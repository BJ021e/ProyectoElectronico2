<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista Multiespectral - RPi3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --primary: #3b82f6; --border: #334155; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        
        /* Navbar */
        .navbar { background: var(--card); padding: 1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: center; }
        .brand { font-size: 1.5rem; font-weight: bold; color: var(--primary); display: flex; gap: 10px; align-items: center; }

        /* Contenedor Principal */
        .main-container {
            flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 20px; overflow-y: auto;
        }

        /* Grid de Imágenes */
        .band-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            width: 100%; max-width: 1200px; margin: 0 auto;
        }

        .band-card {
            background: #000; border: 1px solid var(--border); border-radius: 8px;
            aspect-ratio: 4/3; position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .band-img { width: 100%; height: 100%; object-fit: contain; display: none; }
        .band-placeholder { color: #475569; font-size: 0.9rem; }

        /* Etiquetas de Banda */
        .band-label {
            position: absolute; bottom: 10px; left: 10px;
            background: rgba(0,0,0,0.7); padding: 4px 12px;
            border-radius: 4px; font-weight: bold; font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .lbl-Blue { color: #60a5fa; }
        .lbl-Green { color: #4ade80; }
        .lbl-Red { color: #f87171; }
        .lbl-RedEdge { color: #fbbf24; }
        .lbl-NIR { color: #c084fc; }

        /* Controles */
        .controls-area {
            background: var(--card); padding: 20px; border-top: 1px solid var(--border);
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }

        .btn-snap {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white; border: none; padding: 15px 50px;
            border-radius: 50px; font-size: 1.2rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            display: flex; align-items: center; gap: 10px;
            transition: transform 0.1s;
        }
        .btn-snap:active { transform: scale(0.95); }
        .btn-snap:disabled { background: #475569; cursor: not-allowed; box-shadow: none; }

        .status-msg { color: #94a3b8; font-size: 1rem; height: 20px; }

        /* Spinner */
        .spinner { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 1s infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand"><span>📸</span> Monitor Multiespectral (PC ↔ RPi)</div>
    </nav>

    <div class="main-container">
        <div class="band-grid">
            <!-- Banda 1: Blue -->
            <div class="band-card">
                <span class="band-placeholder">Esperando captura...</span>
                <img id="img-Blue" class="band-img" alt="Blue">
                <div class="band-label lbl-Blue">🔵 Blue</div>
            </div>
            <!-- Banda 2: Green -->
            <div class="band-card">
                <span class="band-placeholder">--</span>
                <img id="img-Green" class="band-img" alt="Green">
                <div class="band-label lbl-Green">🟢 Green</div>
            </div>
            <!-- Banda 3: Red -->
            <div class="band-card">
                <span class="band-placeholder">--</span>
                <img id="img-Red" class="band-img" alt="Red">
                <div class="band-label lbl-Red">🔴 Red</div>
            </div>
            <!-- Banda 4: RedEdge -->
            <div class="band-card">
                <span class="band-placeholder">--</span>
                <img id="img-RedEdge" class="band-img" alt="RedEdge">
                <div class="band-label lbl-RedEdge">🟤 RedEdge</div>
            </div>
            <!-- Banda 5: NIR -->
            <div class="band-card">
                <span class="band-placeholder">--</span>
                <img id="img-NIR" class="band-img" alt="NIR">
                <div class="band-label lbl-NIR">🟣 NIR</div>
            </div>
        </div>
    </div>

    <div class="controls-area">
        <div class="status-msg" id="statusMsg">Conexión lista con RPi.</div>
        <button class="btn-snap" id="btnSnap" onclick="captureAll()">
            <div class="spinner" id="loader"></div>
            <span id="btnText">CAPTURAR TODO</span>
        </button>
    </div>

    <script>
        function captureAll() {
            const btn = document.getElementById('btnSnap');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');
            const status = document.getElementById('statusMsg');
            const bands = ["Blue", "Green", "Red", "RedEdge", "NIR"];

            // 1. UI Bloqueada
            btn.disabled = true;
            btnText.innerText = "PROCESANDO...";
            loader.style.display = "block";
            status.innerHTML = "Enviando orden a RPi... <span style='color:#3b82f6'>Disparando cámara...</span>";

            // Resetear imágenes
            bands.forEach(b => {
                const img = document.getElementById(`img-${b}`);
                img.style.display = 'none';
                img.parentElement.querySelector('.band-placeholder').style.display = 'block';
            });

            // 2. Petición al Backend
            fetch('/trigger_snapshot', { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    if (data.status === 'success') {
                        // 3. Actualizar imágenes
                        const images = data.images;
                        let count = 0;
                        
                        bands.forEach(b => {
                            if (images[b]) {
                                const img = document.getElementById(`img-${b}`);
                                // Timestamp para evitar caché
                                img.src = images[b] + "?t=" + new Date().getTime();
                                img.onload = () => {
                                    img.style.display = 'block';
                                    img.parentElement.querySelector('.band-placeholder').style.display = 'none';
                                };
                                count++;
                            }
                        });

                        status.innerHTML = `✅ <strong>Captura Exitosa</strong> (${count} bandas recibidas)`;
                        status.style.color = "#10b981";
                    } else {
                        status.innerText = "❌ Error: " + data.msg;
                        status.style.color = "#ef4444";
                    }
                })
                .catch(err => {
                    status.innerText = "❌ Error de Red con el PC/RPi";
                    status.style.color = "#ef4444";
                    console.error(err);
                })
                .finally(() => {
                    btn.disabled = false;
                    btnText.innerText = "CAPTURAR TODO";
                    loader.style.display = "none";
                });
        }
    </script>
</body>
</html>
