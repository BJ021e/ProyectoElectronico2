<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Ground Control</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card card fade-in">
            <div class="login-header">
                <div class="login-icon">
                    📡
                </div>
                <h1 class="login-title">Ground Control</h1>
                <p class="login-subtitle">Sistema de Inspección Terrestre & Telemetría</p>
            </div>

            {% if error %}
            <div class="alert alert-error">
                <span>⚠️</span>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('ground_login') }}">
                <div class="form-group">
                    <label for="code" class="form-label">Código de Misión</label>
                    <input
                        type="password"
                        id="code"
                        name="code"
                        class="form-input"
                        placeholder="Ingrese código (sapo)"
                        required
                        autofocus
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                    <span>🚀</span>
                    <span>Iniciar Operación</span>
                </button>
            </form>

            <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--dark-border); text-align: center;">
                <p style="color: var(--text-muted); font-size: 0.875rem;">
                    <strong>Estado del Sistema:</strong>
                </p>
                <ul style="list-style: none; padding: 0; margin-top: 1rem; text-align: left; color: var(--text-secondary); font-size: 0.9rem;">
                    <li style="padding: 0.3rem 0;">✓ Conexión RPi (Telemetría)</li>
                    <li style="padding: 0.3rem 0;">✓ Cámara MicaSense (Ethernet)</li>
                    <li style="padding: 0.3rem 0;">✓ Procesamiento Local (NDVI/GNDVI)</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // Pequeña animación para el icono de satélite/antena
        const icon = document.querySelector('.login-icon');
        setInterval(() => {
            icon.style.transform = 'scale(1.1) rotate(5deg)';
            setTimeout(() => {
                icon.style.transform = 'scale(1) rotate(0deg)';
            }, 300);
        }, 4000);
    </script>
</body>
</html>
