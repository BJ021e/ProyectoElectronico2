<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control de Vuelo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        /* Estilos de Cabina */
        .flight-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-top: 20px; }
        
        /* Botones Grandes */
        .btn-flight {
            width: 100%; padding: 20px; margin-bottom: 15px;
            border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 1.2rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: transform 0.1s;
        }
        .btn-flight:active { transform: scale(0.98); }
        .btn-takeoff { background: linear-gradient(to right, #059669, #10b981); }
        .btn-land { background: linear-gradient(to right, #d97706, #f59e0b); }
        .btn-rtl { background: linear-gradient(to right, #dc2626, #ef4444); }
        
        /* Visor */
        .cockpit-view {
            background: black; height: 400px; border-radius: 12px; border: 2px solid #334155;
            display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
        }
        #liveImage { height: 100%; }
        .overlay-stat { position: absolute; top: 10px; left: 10px; color: #0f0; font-family: monospace; background: rgba(0,0,0,0.5); padding: 5px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container navbar-content">
            <div class="navbar-brand">🎮 Centro de Control</div>
            <div class="navbar-nav"><span id="net-status" class="badge badge-secondary">Conectando...</span></div>
        </div>
    </nav>

    <div class="container">
        <div class="flight-grid">
            
            <!-- MANDOS -->
            <div class="card">
                <h2>🕹️ Comandos</h2>
                <button class="btn-flight btn-takeoff" onclick="cmd('takeoff')">🚀 ARMAR Y DESPEGAR</button>
                <button class="btn-flight btn-land" onclick="cmd('land')">🛬 ATERRIZAR</button>
                <button class="btn-flight btn-rtl" onclick="cmd('rtl')">🏠 RETORNO (RTL)</button>
                
                <div style="margin-top: 20px; background: #0f172a; color: #0f0; padding: 10px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 0.9rem;" id="console">
                    > Sistema listo.<br>
                </div>
            </div>

            <!-- VISOR + DATOS -->
            <div class="card">
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <h3>📷 Cámara en Vivo</h3>
                    <button class="btn btn-primary" id="btnCam" onclick="snap()">📸 FOTO</button>
                </div>
                
                <div class="cockpit-view">
                    <div class="overlay-stat">LIVE FEED</div>
                    <img id="liveImage" alt="Sin imagen">
                </div>

                <div class="stats-grid" style="margin-top: 15px; grid-template-columns: repeat(3, 1fr);">
                    <div class="stat-card"><div class="stat-value" id="alt">--</div><div class="stat-label">Altitud</div></div>
                    <div class="stat-card"><div class="stat-value" id="vel">--</div><div class="stat-label">Velocidad</div></div>
                    <div class="stat-card"><div class="stat-value" id="bat">--</div><div class="stat-label">Batería</div></div>
                    <div class="stat-card"><div class="stat-value" id="mod">--</div><div class="stat-label">Modo</div></div>
                    <div class="stat-card"><div class="stat-value" id="arm">--</div><div class="stat-label">Motor</div></div>
                    <div class="stat-card"><div class="stat-value" id="sat">--</div><div class="stat-label">GPS</div></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function log(m) { 
            const c = document.getElementById('console'); 
            c.innerHTML += `> ${m}<br>`; 
            c.scrollTop = c.scrollHeight; 
        }

        // Telemetría rápida
        setInterval(() => {
            fetch('/api/proxy_telemetry').then(r=>r.json()).then(d => {
                document.getElementById('net-status').className = d.error ? 'badge badge-danger' : 'badge badge-success';
                document.getElementById('net-status').innerText = d.error ? 'DESCONECTADO' : 'CONECTADO';
                
                if(!d.error) {
                    document.getElementById('alt').innerText = (d.altitud||0).toFixed(1) + 'm';
                    document.getElementById('vel').innerText = (d.velocidad||0).toFixed(1) + 'm/s';
                    document.getElementById('bat').innerText = d.bateria;
                    document.getElementById('mod').innerText = d.modo;
                    document.getElementById('arm').innerText = d.armado ? 'ON' : 'OFF';
                    document.getElementById('arm').style.color = d.armado ? 'red' : 'white';
                }
            });
        }, 500);

        // Comandos
        function cmd(action) {
            if(!confirm(`¿Confirmar comando: ${action.toUpperCase()}?`)) return;
            log(`Enviando ${action}...`);
            fetch(`/api/send_command/${action}`, {method:'POST'})
                .then(r=>r.json())
                .then(d => {
                    if(d.status==='success') log(`✅ ${d.msg}`);
                    else log(`❌ Error: ${d.msg}`);
                })
                .catch(()=>log("❌ Error de Red"));
        }

        // Foto
        function snap() {
            const btn = document.getElementById('btnCam');
            btn.disabled = true; btn.innerText = "⏳";
            log("📸 Capturando...");
            
            fetch('/api/get_live_snapshot')
                .then(r=>r.json())
                .then(d => {
                    if(d.status==='success') {
                        document.getElementById('liveImage').src = d.image_url + "?t=" + new Date().getTime();
                        log("📸 Foto recibida.");
                    } else log(`⚠️ Cam Error: ${d.msg}`);
                })
                .finally(() => { btn.disabled = false; btn.innerText = "📸 FOTO"; });
        }
    </script>
</body>
</html>
