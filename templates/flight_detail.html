<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Detalle del Vuelo</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}"
    >

    <style>

        .detail-page {
            min-height: 100vh;
            background: #0f172a;
            color: #f8fafc;
            padding: 32px;
        }

        .detail-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
            margin-bottom: 32px;
        }

        .detail-title h1 {
            margin: 0;
            font-size: 2rem;
        }

        .detail-title p {
            margin-top: 8px;
            color: #94a3b8;
        }

        .back-button {
            text-decoration: none;
            color: #e2e8f0;
            border: 1px solid #334155;
            padding: 10px 16px;
            border-radius: 8px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .summary-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px;
        }

        .summary-label {
            color: #94a3b8;
            font-size: 0.82rem;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .summary-value {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .section-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .section-title {
            margin: 0 0 18px 0;
            font-size: 1.2rem;
        }

        .telemetry-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
        }

        .telemetry-item {
            background: #111827;
            border: 1px solid #334155;
            border-radius: 9px;
            padding: 14px;
        }

        .route-placeholder {
            min-height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;

            border: 1px dashed #475569;
            border-radius: 10px;

            color: #94a3b8;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .status-completed {
            color: #34d399;
            background: rgba(16, 185, 129, 0.15);
        }

        .status-active {
            color: #60a5fa;
            background: rgba(59, 130, 246, 0.15);
        }

        .status-created {
            color: #fbbf24;
            background: rgba(245, 158, 11, 0.15);
        }

        .status-other {
            color: #cbd5e1;
            background: rgba(148, 163, 184, 0.15);
        }

        .loading-state,
        .error-state {
            padding: 50px;
            text-align: center;
            color: #94a3b8;
        }

        .flight-map {
            width: 100%;
            height: 430px;

            border-radius: 10px;
            overflow: hidden;

            display: none;
        }
        
        .mission-map-wrapper {
            position: relative;
        }


        .map-legend {
            position: absolute;

            right: 16px;
            top: 16px;

            z-index: 1000;

            background: rgba(15, 23, 42, 0.92);

            border: 1px solid #334155;
            border-radius: 8px;

            padding: 10px 14px;

            color: #e2e8f0;

            font-size: 0.82rem;
        }


        .legend-item {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 5px 0;
        }


        .legend-line {
            display: inline-block;

            width: 30px;
            height: 0;

            border-top-width: 3px;
            border-top-style: solid;
        }


        .planned-line {
            border-top-color: #f59e0b;
            border-top-style: dashed;
        }


        .executed-line {
            border-top-color: #3b82f6;
        }

        .waypoint-number {
            background: transparent;
            border: none;
            box-shadow: none;

            color: #ffffff;

            font-weight: 700;
        }

    </style>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >
</head>


<body>

<div class="detail-page">

    <div class="detail-container">

        <header class="detail-header">

            <div class="detail-title">

                <h1 id="flightCode">
                    Detalle del vuelo
                </h1>

                <p id="flightName">
                    Cargando información...
                </p>

            </div>

            <a
                href="/flight_history"
                class="back-button"
            >
                Volver al historial
            </a>

        </header>


        <div
            id="loadingState"
            class="loading-state"
        >
            Cargando vuelo...
        </div>


        <main
            id="flightContent"
            style="display: none;"
        >

            <section class="summary-grid">

                <div class="summary-card">
                    <div class="summary-label">
                        Estado
                    </div>

                    <div
                        class="summary-value"
                        id="flightStatus"
                    >
                        --
                    </div>
                </div>


                <div class="summary-card">
                    <div class="summary-label">
                        Inicio
                    </div>

                    <div
                        class="summary-value"
                        id="flightStart"
                    >
                        --
                    </div>
                </div>


                <div class="summary-card">
                    <div class="summary-label">
                        Fin
                    </div>

                    <div
                        class="summary-value"
                        id="flightEnd"
                    >
                        --
                    </div>
                </div>


                <div class="summary-card">
                    <div class="summary-label">
                        Duración
                    </div>

                    <div
                        class="summary-value"
                        id="flightDuration"
                    >
                        --
                    </div>
                </div>


                <div class="summary-card">
                    <div class="summary-label">
                        Puntos de telemetría
                    </div>

                    <div
                        class="summary-value"
                        id="telemetryCount"
                    >
                        --
                    </div>
                </div>

                <div class="summary-card">

                <div class="summary-label">
                    Ruta planificada
                </div>

                <div
                    class="summary-value"
                    id="plannedRoute"
                >
                    --
                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    Waypoints
                </div>

                <div
                    class="summary-value"
                    id="plannedWaypointCount"
                >
                    --
                </div>

            </div>

            </section>


            <section class="section-card">

                <h2 class="section-title">
                    Ruta planificada vs. recorrido ejecutado
                </h2>

                <div class="mission-map-wrapper">

                    <div
                        id="flightMap"
                        class="flight-map"
                    ></div>


                    <div
                        id="mapLegend"
                        class="map-legend"
                        style="display: none;"
                    >

                        <div class="legend-item">

                            <span
                                class="legend-line planned-line"
                            ></span>

                            Ruta planificada

                        </div>


                        <div class="legend-item">

                            <span
                                class="legend-line executed-line"
                            ></span>

                            Recorrido ejecutado

                        </div>

                    </div>

                </div>

                <div
                    id="routePlaceholder"
                    class="route-placeholder"
                >
                    Preparando información del recorrido...
                </div>

            </section>

        </main>

    </div>

</div>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

const FLIGHT_ID = {{ flight_id | tojson }};


function formatDate(value) {

    if (!value) {
        return "--";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return value;
    }

    return date.toLocaleString();
}


function formatDuration(seconds) {

    if (
        seconds === null ||
        seconds === undefined
    ) {
        return "--";
    }

    const totalSeconds =
        Math.round(seconds);

    const hours =
        Math.floor(totalSeconds / 3600);

    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );

    const secs =
        totalSeconds % 60;


    if (hours > 0) {

        return [
            hours,
            minutes
                .toString()
                .padStart(2, "0"),
            secs
                .toString()
                .padStart(2, "0")
        ].join(":");
    }


    return [
        minutes,
        secs
            .toString()
            .padStart(2, "0")
    ].join(":");
}


function getStatusClass(status) {

    switch (status) {

        case "COMPLETED":
            return "status-completed";

        case "ACTIVE":
            return "status-active";

        case "CREATED":
            return "status-created";

        default:
            return "status-other";
    }
}

function renderMissionMap(
    plannedWaypoints,
    executedPoints
) {

    const mapElement =
        document.getElementById(
            "flightMap"
        );

    const placeholder =
        document.getElementById(
            "routePlaceholder"
        );

    const legend =
        document.getElementById(
            "mapLegend"
        );


    /*
     * -----------------------------------------
     * Validar puntos planificados
     * -----------------------------------------
     */

    const validPlanned =
        (plannedWaypoints ?? [])
        .filter((point) => {

            const lat =
                Number(point.latitude);

            const lon =
                Number(point.longitude);

            return (
                Number.isFinite(lat) &&
                Number.isFinite(lon)
            );
        });


    /*
     * -----------------------------------------
     * Validar puntos ejecutados
     * -----------------------------------------
     */

    const validExecuted =
        (executedPoints ?? [])
        .filter((point) => {

            const lat =
                Number(point.latitude);

            const lon =
                Number(point.longitude);

            return (
                Number.isFinite(lat) &&
                Number.isFinite(lon)
            );
        });


    /*
     * -----------------------------------------
     * No existe información geográfica
     * -----------------------------------------
     */

    if (
        validPlanned.length === 0 &&
        validExecuted.length === 0
    ) {

        mapElement.style.display =
            "none";

        legend.style.display =
            "none";

        placeholder.style.display =
            "flex";

        placeholder.textContent =
            "Este vuelo no contiene información geográfica.";

        return;
    }


    placeholder.style.display =
        "none";

    mapElement.style.display =
        "block";

    legend.style.display =
        "block";


    /*
     * -----------------------------------------
     * Crear mapa
     * -----------------------------------------
     */

    const map =
        L.map(
            "flightMap",
            {
                zoomControl: true
            }
        );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,

            attribution:
                "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);


    const allCoordinates = [];


    /*
     * =========================================
     * RUTA PLANIFICADA
     * =========================================
     */

    if (validPlanned.length > 0) {

        const plannedCoordinates =
            validPlanned.map(
                point => [
                    Number(point.latitude),
                    Number(point.longitude)
                ]
            );


        allCoordinates.push(
            ...plannedCoordinates
        );


        /*
         * Con dos o más puntos ya podemos
         * dibujar la ruta.
         */

        if (
            plannedCoordinates.length >= 2
        ) {

            L.polyline(
                plannedCoordinates,
                {
                    color: "#f59e0b",
                    weight: 4,
                    opacity: 0.9,
                    dashArray: "8, 8"
                }
            )
            .addTo(map);

        }


        /*
         * Waypoints planificados numerados
         */

        validPlanned.forEach(
            (waypoint) => {

                const coordinate = [
                    Number(
                        waypoint.latitude
                    ),

                    Number(
                        waypoint.longitude
                    )
                ];


                const marker =
                    L.circleMarker(
                        coordinate,
                        {
                            radius: 8,

                            color:
                                "#f59e0b",

                            fillColor:
                                "#f59e0b",

                            fillOpacity:
                                0.9,

                            weight:
                                2
                        }
                    )
                    .addTo(map);


                marker.bindTooltip(
                    String(
                        waypoint.sequence
                    ),
                    {
                        permanent: true,

                        direction:
                            "center",

                        className:
                            "waypoint-number"
                    }
                );


                marker.bindPopup(`
                    <strong>
                        Waypoint planificado
                        ${waypoint.sequence}
                    </strong>

                    <br>

                    Altitud:
                    ${waypoint.altitude ?? "--"} m

                    <br>

                    Velocidad:
                    ${waypoint.speed ?? "--"} m/s
                `);

            }
        );

    }


    /*
     * =========================================
     * TRAYECTORIA EJECUTADA
     * =========================================
     */

    if (validExecuted.length > 0) {

        const executedCoordinates =
            validExecuted.map(
                point => [
                    Number(point.latitude),
                    Number(point.longitude)
                ]
            );


        allCoordinates.push(
            ...executedCoordinates
        );


        /*
         * Con dos o más muestras
         * representamos el recorrido real.
         */

        if (
            executedCoordinates.length >= 2
        ) {

            L.polyline(
                executedCoordinates,
                {
                    color: "#3b82f6",
                    weight: 5,
                    opacity: 0.95
                }
            )
            .addTo(map);

        }


        /*
         * Punto inicial ejecutado
         */

        const first =
            validExecuted[0];


        L.circleMarker(
            executedCoordinates[0],
            {
                radius: 7,

                color:
                    "#22c55e",

                fillColor:
                    "#22c55e",

                fillOpacity:
                    1,

                weight:
                    2
            }
        )
        .addTo(map)
        .bindPopup(`
            <strong>
                Inicio ejecutado
            </strong>

            <br>

            Altitud:
            ${first.altitude ?? "--"} m

            <br>

            Velocidad:
            ${first.speed ?? "--"} m/s

            <br>

            Batería:
            ${first.battery ?? "--"} %
        `);


        /*
         * Puntos intermedios ejecutados
         */

        if (
            validExecuted.length > 2
        ) {

            validExecuted
                .slice(1, -1)
                .forEach(
                    point => {

                        L.circleMarker(
                            [
                                Number(
                                    point.latitude
                                ),

                                Number(
                                    point.longitude
                                )
                            ],
                            {
                                radius: 4,

                                color:
                                    "#3b82f6",

                                fillColor:
                                    "#3b82f6",

                                fillOpacity:
                                    0.9,

                                weight:
                                    1
                            }
                        )
                        .addTo(map)
                        .bindPopup(`
                            <strong>
                                Telemetría
                            </strong>

                            <br>

                            Altitud:
                            ${point.altitude ?? "--"} m

                            <br>

                            Velocidad:
                            ${point.speed ?? "--"} m/s

                            <br>

                            Batería:
                            ${point.battery ?? "--"} %
                        `);

                    }
                );
        }


        /*
         * Punto final ejecutado
         */

        if (
            validExecuted.length >= 2
        ) {

            const lastIndex =
                validExecuted.length - 1;

            const last =
                validExecuted[lastIndex];


            L.circleMarker(
                executedCoordinates[
                    lastIndex
                ],
                {
                    radius: 7,

                    color:
                        "#ef4444",

                    fillColor:
                        "#ef4444",

                    fillOpacity:
                        1,

                    weight:
                        2
                }
            )
            .addTo(map)
            .bindPopup(`
                <strong>
                    Último punto ejecutado
                </strong>

                <br>

                Altitud:
                ${last.altitude ?? "--"} m

                <br>

                Velocidad:
                ${last.speed ?? "--"} m/s

                <br>

                Batería:
                ${last.battery ?? "--"} %
            `);

        }

    }


    /*
     * =========================================
     * AJUSTAR MAPA
     * =========================================
     */

    if (
        allCoordinates.length === 1
    ) {

        map.setView(
            allCoordinates[0],
            18
        );

    } else {

        map.fitBounds(
            allCoordinates,
            {
                padding: [40, 40]
            }
        );

    }


    requestAnimationFrame(
        () => {

            map.invalidateSize();

        }
    );

}

async function loadFlight() {

    const loading =
        document.getElementById(
            "loadingState"
        );

    const content =
        document.getElementById(
            "flightContent"
        );


    try {

        /*
         * =========================================
         * CARGAR MISIÓN CONSOLIDADA
         * =========================================
         */

        const response =
            await fetch(
                `/api/flights/${FLIGHT_ID}/mission`
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );
        }


        const mission =
            await response.json();


        /*
         * =========================================
         * EXTRAER INFORMACIÓN
         * =========================================
         */

        const flight =
            mission.flight;


        const plannedRoute =
            mission.planned_route;


        const executedTrajectory =
            mission.executed_trajectory;


        /*
         * =========================================
         * INFORMACIÓN GENERAL DEL VUELO
         * =========================================
         */

        document.getElementById(
            "flightCode"
        ).textContent =
            flight.flight_code;


        document.getElementById(
            "flightName"
        ).textContent =
            flight.name
            ?? "Vuelo sin nombre";


        /*
         * Estado
         */

        const statusElement =
            document.getElementById(
                "flightStatus"
            );


        statusElement.innerHTML = `
            <span
                class="
                    status-badge
                    ${getStatusClass(
                        flight.status
                    )}
                "
            >
                ${flight.status}
            </span>
        `;


        /*
         * Inicio
         */

        document.getElementById(
            "flightStart"
        ).textContent =
            formatDate(
                flight.started_at
            );


        /*
         * Fin
         */

        document.getElementById(
            "flightEnd"
        ).textContent =
            formatDate(
                flight.finished_at
            );


        /*
         * Duración
         */

        document.getElementById(
            "flightDuration"
        ).textContent =
            formatDuration(
                flight.duration_seconds
            );


        /*
         * Telemetría ejecutada
         */

        document.getElementById(
            "telemetryCount"
        ).textContent =
            executedTrajectory
                .telemetry_count;


        /*
         * =========================================
         * RUTA PLANIFICADA
         * =========================================
         */

        document.getElementById(
            "plannedRoute"
        ).textContent =
            plannedRoute
                ? plannedRoute.route_code
                : "Sin ruta";


        document.getElementById(
            "plannedWaypointCount"
        ).textContent =
            plannedRoute
                ? plannedRoute.waypoint_count
                : "0";


        /*
         * =========================================
         * MOSTRAR CONTENIDO
         * =========================================
         */

        loading.style.display =
            "none";


        content.style.display =
            "block";


        /*
         * =========================================
         * MAPA
         * =========================================
         *
         * Leaflet debe inicializarse después de
         * hacer visible el contenedor.
         */

        requestAnimationFrame(
            () => {

                renderMissionMap(

                    plannedRoute
                        ? plannedRoute.waypoints
                        : [],

                    executedTrajectory.points
                        ?? []

                );

            }
        );


    } catch (error) {

        console.error(
            "Error cargando misión:",
            error
        );


        loading.className =
            "error-state";


        loading.textContent =
            "No fue posible cargar el vuelo.";
    }

}


document.addEventListener(
    "DOMContentLoaded",
    loadFlight
);

</script>

</body>
</html>
