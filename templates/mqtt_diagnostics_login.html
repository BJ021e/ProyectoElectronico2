
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>PE2 | Acceso a diagnósticos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            color: #172337;
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
        }

        main {
            width: min(360px, 90%);
            padding: 28px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
        }

        label, input, button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin-top: 12px;
        }

        input, button {
            padding: 12px;
        }

        button {
            background: #1d4ed8;
            border: 0;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }

        .error {
            color: #b91c1c;
        }
    </style>
</head>
<body>
    <main>
        <h1>Diagnósticos PE2</h1>
        <p>Acceso local al panel MQTT.</p>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post"
              action="{{ url_for('mqtt_diagnostics_login') }}">
            <label for="code">Código de acceso</label>

            <input
                id="code"
                name="code"
                type="password"
                autocomplete="off"
                required
            >

            <button type="submit">
                Acceder
            </button>
        </form>
    </main>
</body>
</html>
