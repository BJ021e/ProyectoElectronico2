<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Vuelo - RPi</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Roboto Mono', monospace; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* Encabezado */
        .header { width: 100%; padding: 15px; background: #1e293b; text-align: center; border-bottom: 2px solid #334155; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        .status-badge { padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }
        .connected { background: #10b981; color: #000; }
        .disconnected { background: #ef4444; color: #fff; }

        /* Grid Principal */
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 90%; max-width: 1000px; margin-top: 30px; }

        /* Tarjetas */
        .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { margin-top: 0; color: #3b82f6; font-size: 1.2rem; border-bottom: 1px solid #334155; padding-bottom: 10px; }

        /* Botones de Vuelo */
        .btn-grid { display: flex; flex-direction: column; gap: 15px; }
        .btn { padding: 20px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; color: white; cursor: pointer; transition: transform 0.1s; text-transform: uppercase; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-takeoff { background: linear-gradient(135deg, #059669, #10b981); box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .btn-land { background: linear-gradient(135deg, #d97706, #f59e0b); }
        .btn-rtl { background: linear-gradient(135deg, #dc2626, #ef4444); }

        /* Telemetría */
        .telemetry-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .stat-box { background: #0f172a; padding: 10px; border-radius: 8px; text-align: center; }
        .stat-val { font-size: 1.5rem; font-weight: bold; color: #fff; }
        .stat-label { font-size: 0.8rem; color: #94a3b8; margin-top: 5px; }

        /* Consola */
        .console { background: #000; color: #22c55e; padding: 15px; height: 150px; overflow-y: auto; font-size: 0.85rem; border-radius: 8px; border: 1px solid #334155; grid-column: span 2; }
    </style>
</head>
<body>

    <div class="header">
        <span>🚁 COMMAND CENTER</span>
        <span id="connection-status" class="status-badge disconnected">DESCONECTADO</span>
    </div>

    <div class="container">
        <div class="card">
            <h2>🕹️ Comandos de Vuelo</h2>
            <div class="btn-grid">
                <button class="btn btn-takeoff" onclick="sendCommand('takeoff')">🚀 Armar y Despegar (3m)</button>
                <button class="btn btn-land" onclick="sendCommand('land')">🛬 Aterrizar (LAND)</button>
                <button class="btn btn-rtl" onclick="sendCommand('rtl')">🏠 Retorno a Casa (RTL)</button>
            </div>
        </div>

        <div class="card">
            <h2>📊 Telemetría en Vivo</h2>
            <div class="telemetry-grid">
                <div class="stat-box">
                    <div class="stat-val" id="alt">--</div>
                    <div class="stat-label">Altitud (m)</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="vel">--</div>
                    <div class="stat-label">Velocidad (m/s)</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="bat">--</div>
                    <div class="stat-label">Batería</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="mode">--</div>
                    <div class="stat-label">Modo Vuelo</div>
                </div>
                <div class="stat-box" style="grid-column: span 2;">
                    <div class="stat-val" id="gps">--</div>
                    <div class="stat-label">Estado GPS / Armado</div>
                </div>
            </div>
        </div>

        <div class="console" id="console">
            > Sistema iniciado...<br>
            > Esperando conexión con Raspberry Pi...
        </div>
    </div>

    <script>
        // Función para escribir en la consola negra
        function log(msg) {
            const c = document.getElementById('console');
            const time = new Date().toLocaleTimeString();
            c.innerHTML += `> [${time}] ${msg}<br>`;
            c.scrollTop = c.scrollHeight;
        }

        // Enviar Comandos
        function sendCommand(action) {
            if(!confirm(`⚠️ ¿Estás seguro de enviar: ${action.toUpperCase()}?`)) return;

            log(`Enviando orden: ${action}...`);
            fetch(`/api/send_cmd/${action}`, { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    if(data.status === 'success') log(`✅ ${data.msg}`);
                    else log(`❌ ERROR: ${data.msg}`);
                })
                .catch(e => log(`❌ Error de Red: ${e}`));
        }

        // Loop de Telemetría (cada 500ms)
        setInterval(() => {
            fetch('/api/telemetry')
                .then(r => r.json())
                .then(data => {
                    const badge = document.getElementById('connection-status');
                    
                    if (data.error) {
                        badge.innerText = "DESCONECTADO";
                        badge.className = "status-badge disconnected";
                    } else {
                        badge.innerText = "CONECTADO";
                        badge.className = "status-badge connected";

                        // Actualizar UI
                        document.getElementById('alt').innerText = (data.altitud || 0).toFixed(1);
                        document.getElementById('vel').innerText = (data.velocidad || 0).toFixed(1);
                        document.getElementById('bat').innerText = data.bateria || "N/A";
                        document.getElementById('mode').innerText = data.modo || "--";
                        
                        const armado = data.armado ? "ARMADO ⚠️" : "DISARMED";
                        document.getElementById('gps').innerText = `${armado}`;
                        document.getElementById('gps').style.color = data.armado ? '#ef4444' : '#10b981';
                    }
                })
                .catch(() => {
                    document.getElementById('connection-status').className = "status-badge disconnected";
                });
        }, 500);
    </script>
</body>
</html>
