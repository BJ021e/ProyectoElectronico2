<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesando - Análisis Multiespectral</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .loader-container {
            display: flex; justify-content: center; align-items: center; margin: 2rem 0;
        }
        .spinner {
            width: 60px; height: 60px;
            border: 5px solid var(--dark-border); border-top: 5px solid var(--primary-light);
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .pulse-text { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container navbar-content">
            <div class="navbar-brand">
                <div class="icon">🛰️</div>
                <span>Procesando Datos...</span>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 3rem;">
        
        <div style="text-align: center; margin-bottom: 3rem;" class="fade-in">
            <div class="loader-container"><div class="spinner"></div></div>
            <h1 style="font-size: 2rem; margin-bottom: 1rem;">Generando Mosaico Multiespectral</h1>
            <p class="pulse-text" style="color: var(--text-muted); font-size: 1.125rem;">
                Calculando índices espectrales y sincronizando telemetría...
            </p>
        </div>

        <div class="card fade-in" style="max-width: 900px; margin: 0 auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2 style="display: flex; align-items: center; gap: 0.75rem; margin: 0;">
                    <span style="font-size: 1.5rem;">🛸</span>
                    <span>Telemetría en Vivo (RPi3)</span>
                </h2>
                <span id="conn-status" class="badge badge-secondary">Buscando señal...</span>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-icon stat-icon-primary">🌍</div>
                        <div><div class="stat-label">Latitud</div><div class="stat-value" style="font-size: 1.1rem;" id="lat">--</div></div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-icon stat-icon-primary">🌎</div>
                        <div><div class="stat-label">Longitud</div><div class="stat-value" style="font-size: 1.1rem;" id="lon">--</div></div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-icon stat-icon-warning">📏</div>
                        <div><div class="stat-label">Altitud</div><div class="stat-value"><span id="alt">--</span> <span style="font-size: 0.9rem; color: var(--text-muted);">m</span></div></div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-icon stat-icon-danger">⚡</div>
                        <div><div class="stat-label">Velocidad</div><div class="stat-value"><span id="vel">--</span> <span style="font-size: 0.9rem; color: var(--text-muted);">m/s</span></div></div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-icon stat-icon-success">🔋</div>
                        <div><div class="stat-label">Batería</div><div class="stat-value" id="bat">--</div></div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-icon stat-icon-primary">🎮</div>
                        <div><div class="stat-label">Modo</div><div class="stat-value" style="font-size: 1.1rem;" id="mod">--</div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var telemetryInterval = setInterval(function() {
            fetch('/api/proxy_telemetry')
                .then(r => r.ok ? r.json() : Promise.reject('Error'))
                .then(data => {
                    const badge = document.getElementById('conn-status');
                    if (data.error) {
                        badge.className = 'badge badge-danger'; badge.innerText = '⚠️ ' + data.modo;
                    } else {
                        badge.className = 'badge badge-success'; badge.innerText = '🟢 Conectado';
                        // Actualización de datos con Lat/Lon
                        document.getElementById('lat').innerText = data.latitud ? data.latitud.toFixed(6) : '--';
                        document.getElementById('lon').innerText = data.longitud ? data.longitud.toFixed(6) : '--';
                        document.getElementById('alt').innerText = data.altitud ? data.altitud.toFixed(2) : '--';
                        document.getElementById('vel').innerText = data.velocidad ? data.velocidad.toFixed(2) : '--';
                        document.getElementById('bat').innerText = data.bateria;
                        document.getElementById('mod').innerText = data.modo;
                    }
                })
                .catch(() => {
                    document.getElementById('conn-status').className = 'badge badge-danger';
                    document.getElementById('conn-status').innerText = '❌ Desconectado';
                });
        }, 1000);
        var statusInterval = setInterval(function() {
            fetch('/api/status').then(r => r.json()).then(data => {
                // ✅ DEBE USAR 'result_page' (nombre de la función en Python)
                if (data.status === 'completed') window.location.href = "{{ url_for('result_page') }}"; 
                else if (data.status === 'error') {
                    alert("Error: " + data.error_msg); 
                    window.location.href = "{{ url_for('index') }}";
                }
            });
        }, 2000);
    </script>
</body>
</html>
